<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IT Asset Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; background: #f4f6f8; color: #222; }
    header { background: #1f3a5f; color: #fff; padding: 16px 24px; }
    main { padding: 24px; }
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-bottom: 24px; }
    .card { background: #fff; border-radius: 8px; padding: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
    .card .num { font-size: 32px; font-weight: bold; }
    .card .label { color: #666; font-size: 14px; }
    .charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; margin-bottom: 24px; }
    .chart-card { background: #fff; border-radius: 8px; padding: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
    .chart-card h3 { margin: 0 0 12px; font-size: 15px; }
    .chart-box { position: relative; height: 240px; }
    .filters { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 16px; }
    .filters input, .filters select { padding: 8px 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
    .filters input { min-width: 240px; }
    #count { color: #666; font-size: 14px; }
    dialog { border: none; border-radius: 8px; padding: 20px; width: 380px; box-shadow: 0 4px 16px rgba(0,0,0,.25); }
    dialog::backdrop { background: rgba(0,0,0,.4); }
    dialog label { display: block; margin-top: 12px; font-size: 14px; }
    dialog select, dialog input { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; }
    .btn { padding: 6px 12px; border: none; border-radius: 6px; background: #1f3a5f; color: #fff; cursor: pointer; }
    .btn:disabled { background: #aaa; cursor: not-allowed; }
    .btn.secondary { background: #e5e7eb; color: #222; }
    #transfer-error { color: #b91c1c; font-size: 14px; margin-top: 10px; }
    .banner { display: none; background: #fee2e2; color: #991b1b; padding: 12px 24px; font-size: 14px; }
    .table-wrap { background: #fff; border-radius: 8px; box-shadow: 0 1px 3px rgba(0,0,0,.1); overflow-x: auto; }
    table { border-collapse: collapse; width: 100%; font-size: 14px; }
    th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid #eee; white-space: nowrap; }
    th { background: #f0f3f7; position: sticky; top: 0; }
  </style>
</head>
<body>
  <header><h1>IT Asset Dashboard</h1></header>
  <div id="api-error" class="banner">Cannot reach the server. Make sure the API is running, then reload this page.</div>
  <main>
    <div class="cards">
      <div class="card"><div class="num" id="kpi-total">-</div><div class="label">Total assets</div></div>
      <div class="card"><div class="num" id="kpi-issued">-</div><div class="label">Issued</div></div>
      <div class="card"><div class="num" id="kpi-stock">-</div><div class="label">In stock</div></div>
      <div class="card"><div class="num" id="kpi-repair">-</div><div class="label">Under repair</div></div>
    </div>

    <div class="charts">
      <div class="chart-card"><h3>By status</h3><div class="chart-box"><canvas id="chart-status"></canvas></div></div>
      <div class="chart-card"><h3>By condition</h3><div class="chart-box"><canvas id="chart-condition"></canvas></div></div>
      <div class="chart-card"><h3>By item type</h3><div class="chart-box"><canvas id="chart-type"></canvas></div></div>
      <div class="chart-card"><h3>By department</h3><div class="chart-box"><canvas id="chart-dept"></canvas></div></div>
    </div>

    <div class="filters">
      <input id="search" type="search" placeholder="Search serial no., name, model...">
      <select id="f-dept"><option value="">All departments</option></select>
      <select id="f-type"><option value="">All item types</option></select>
      <select id="f-status"><option value="">All statuses</option></select>
      <select id="f-condition"><option value="">All conditions</option></select>
      <button class="btn" id="add-btn">+ Add asset</button>
      <button class="btn secondary" id="export-btn">Export CSV</button>
      <span id="count"></span>
    </div>

    <div class="table-wrap">
      <table>
        <thead><tr id="head-row"></tr></thead>
        <tbody id="body"></tbody>
      </table>
    </div>
  </main>

  <dialog id="transfer-dialog">
    <h3>Transfer asset</h3>
    <div id="transfer-asset"></div>
    <label>Transfer to
      <select id="t-to"></select>
    </label>
    <label>Handled by (IT staff)
      <select id="t-by"></select>
    </label>
    <label>Notes (optional)
      <input id="t-notes" maxlength="500">
    </label>
    <div id="transfer-error"></div>
    <div style="margin-top:16px; display:flex; gap:8px; justify-content:flex-end;">
      <button class="btn secondary" id="t-cancel">Cancel</button>
      <button class="btn" id="t-save">Save transfer</button>
    </div>
  </dialog>

  <dialog id="add-dialog">
    <h3>Add new asset</h3>
  <label>Item type *
  <select id="a-type">
    <option value="">Select type...</option>
    <option>Laptop</option>
    <option>Desktop</option>
    <option>Monitor</option>
  </select>
</label>
    <label>Brand <input id="a-brand"></label>
    <label>Model <input id="a-model"></label>
    <label>Serial No. * <input id="a-serial"></label>
    <label>Memory <input id="a-memory" placeholder="16GB"></label>
    <label>Storage <input id="a-storage" placeholder="512GB SSD"></label>
    <label>Processor <input id="a-processor"></label>
    <label>Condition *
      <select id="a-condition">
        <option>New</option>
        <option>Good</option>
        <option>Fair</option>
        <option>Poor</option>
      </select>
    </label>
    <div id="add-error" style="color:#b91c1c; font-size:14px; margin-top:10px;"></div>
    <div style="margin-top:16px; display:flex; gap:8px; justify-content:flex-end;">
      <button class="btn secondary" id="a-cancel">Cancel</button>
      <button class="btn" id="a-save">Save asset</button>
    </div>
  </dialog>

  <dialog id="edit-dialog">
    <h3>Update asset</h3>
    <div id="edit-asset"></div>
    <label>Condition
      <select id="e-condition">
        <option>New</option>
        <option>Good</option>
        <option>Fair</option>
        <option>Poor</option>
      </select>
    </label>
    <label>Status change
      <select id="e-status">
        <option value="">No change</option>
        <option value="Under Repair">Send for repair</option>
        <option value="Active">Back from repair</option>
        <option value="Retired">Retire permanently</option>
      </select>
    </label>
    <div id="edit-error" style="color:#b91c1c; font-size:14px; margin-top:10px;"></div>
    <div style="margin-top:16px; display:flex; gap:8px; justify-content:flex-end;">
      <button class="btn secondary" id="e-cancel">Cancel</button>
      <button class="btn" id="e-save">Save changes</button>
    </div>
  </dialog>

  <dialog id="history-dialog" style="width:720px; max-width:95vw;">
    <h3>Transfer history</h3>
    <div id="history-asset" style="margin-bottom:12px;"></div>
    <div style="overflow-x:auto; max-height:320px;">
      <table>
        <thead>
          <tr><th>Date</th><th>From</th><th>To</th><th>Handled by</th><th>Notes</th></tr>
        </thead>
        <tbody id="history-body"></tbody>
      </table>
    </div>
    <div style="margin-top:16px; text-align:right;">
      <button class="btn secondary" id="h-close">Close</button>
    </div>
  </dialog>

  <script>
    const API = "";

    function showError() {
      document.getElementById("api-error").style.display = "block";
    }

    async function getJSON(path) {
      const res = await fetch(API + path);
      if (!res.ok) throw new Error("Request failed: " + res.status);
      return res.json();
    }

    const columns = [
      ["EmployeeID", "Employee ID"], ["EmployeeName", "Employee Name"],
      ["Department", "Department"], ["ItemType", "Item Type"],
      ["Brand", "Brand"], ["Model", "Model"], ["SerialNo", "Serial No."],
      ["Memory", "Memory"], ["Storage", "Storage"], ["Processor", "Processor"],
      ["Condition", "Condition"], ["Status", "Status"],
      ["DateIssued", "Date Issued"], ["Designation", "Designation"], ["Grade", "Grade"]
    ];

    function countFor(list, label) {
      const item = list.find(x => x.Label === label);
      return item ? item.Count : 0;
    }

    const colors = ["#1f3a5f", "#3b82f6", "#10b981", "#f59e0b", "#ef4444", "#8b5cf6", "#14b8a6", "#6b7280"];

    function drawChart(id, type, list) {
      new Chart(document.getElementById(id), {
        type: type,
        data: {
          labels: list.map(x => x.Label),
          datasets: [{ data: list.map(x => x.Count), backgroundColor: colors }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: type !== "bar" } },
          scales: type === "bar" ? { y: { beginAtZero: true, ticks: { precision: 0 } } } : {}
        }
      });
    }

    getJSON("/stats")
      .then(s => {
        document.getElementById("kpi-total").textContent = s.total;
        document.getElementById("kpi-issued").textContent = countFor(s.by_status, "Issued");
        document.getElementById("kpi-stock").textContent = countFor(s.by_status, "In Stock");
        document.getElementById("kpi-repair").textContent = countFor(s.by_status, "Under Repair");

        drawChart("chart-status", "doughnut", s.by_status);
        drawChart("chart-condition", "pie", s.by_condition);
        drawChart("chart-type", "bar", s.by_item_type);
        drawChart("chart-dept", "bar", s.by_department);
      }).catch(showError);

    const headRow = document.getElementById("head-row");
    columns.forEach(([key, title]) => {
      const th = document.createElement("th");
      th.textContent = title;
      headRow.appendChild(th);
    });
    const actionTh = document.createElement("th");
    actionTh.textContent = "Actions";
    headRow.appendChild(actionTh);

    let allAssets = [];
    let currentFiltered = [];
    const filterFields = [
      ["f-dept", "Department"], ["f-type", "ItemType"],
      ["f-status", "Status"], ["f-condition", "Condition"]
    ];

    function renderTable() {
      const q = document.getElementById("search").value.toLowerCase();
      const filtered = allAssets.filter(a => {
        for (const [id, key] of filterFields) {
          const v = document.getElementById(id).value;
          if (v && (a[key] ?? "") !== v) return false;
        }
        if (!q) return true;
        return columns.some(([key]) => String(a[key] ?? "").toLowerCase().includes(q));
      });

      currentFiltered = filtered;

      const body = document.getElementById("body");
      body.innerHTML = "";
      filtered.forEach(a => {
        const tr = document.createElement("tr");
        columns.forEach(([key]) => {
          const td = document.createElement("td");
          td.textContent = a[key] ?? "";
          tr.appendChild(td);
        });

        const actionTd = document.createElement("td");

        const btn = document.createElement("button");
        btn.className = "btn";
        btn.textContent = "Transfer";
        btn.disabled = a.Status === "Retired";
        btn.addEventListener("click", () => openTransfer(a));
        actionTd.appendChild(btn);

        const editBtn = document.createElement("button");
        editBtn.className = "btn secondary";
        editBtn.style.marginLeft = "6px";
        editBtn.textContent = "Edit";
        editBtn.disabled = a.Status === "Retired";
        editBtn.addEventListener("click", () => openEdit(a));
        actionTd.appendChild(editBtn);

        const histBtn = document.createElement("button");
        histBtn.className = "btn secondary";
        histBtn.style.marginLeft = "6px";
        histBtn.textContent = "History";
        histBtn.addEventListener("click", () => openHistory(a));
        actionTd.appendChild(histBtn);

        tr.appendChild(actionTd);
        body.appendChild(tr);
      });
      document.getElementById("count").textContent =
        "Showing " + filtered.length + " of " + allAssets.length;
    }

    getJSON("/assets")
      .then(assets => {
        allAssets = assets;

        filterFields.forEach(([id, key]) => {
          const select = document.getElementById(id);
          const values = [...new Set(assets.map(a => a[key]).filter(v => v))].sort();
          values.forEach(v => {
            const opt = document.createElement("option");
            opt.value = v;
            opt.textContent = v;
            select.appendChild(opt);
          });
          select.addEventListener("change", renderTable);
        });
        document.getElementById("search").addEventListener("input", renderTable);

        renderTable();
      }).catch(showError);

    // ---------- Transfer ----------
    let currentAssetId = null;

    function fillSelect(id, list, blankLabel) {
      const select = document.getElementById(id);
      select.innerHTML = "";
      if (blankLabel) {
        const blank = document.createElement("option");
        blank.value = "";
        blank.textContent = blankLabel;
        select.appendChild(blank);
      }
      list.forEach(e => {
        const opt = document.createElement("option");
        opt.value = e.EmployeeID;
        opt.textContent = e.EmployeeName + " (" + e.EmployeeID + ")";
        select.appendChild(opt);
      });
    }

    getJSON("/employees")
      .then(list => {
        fillSelect("t-to", list, "IT Stock (return to IT)");
        fillSelect("t-by", list.filter(e => e.Department === "IT"));
      }).catch(showError);

    function openTransfer(asset) {
      currentAssetId = asset.AssetID;
      document.getElementById("transfer-asset").textContent =
        asset.ItemType + " - " + asset.SerialNo + " (now with: " + (asset.EmployeeName || "IT Stock") + ")";
      document.getElementById("t-notes").value = "";
      document.getElementById("transfer-error").textContent = "";
      document.getElementById("transfer-dialog").showModal();
    }

    document.getElementById("t-cancel").addEventListener("click", () => {
      document.getElementById("transfer-dialog").close();
    });

    document.getElementById("t-save").addEventListener("click", async () => {
      const errorBox = document.getElementById("transfer-error");
      const body = {
        AssetID: currentAssetId,
        ToEmployeeID: document.getElementById("t-to").value || null,
        HandledByID: document.getElementById("t-by").value,
        Notes: document.getElementById("t-notes").value || null
      };
      const res = await fetch(API + "/transfers", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body)
      });
      if (res.ok) {
        location.reload();
      } else {
        const err = await res.json();
        errorBox.textContent = typeof err.detail === "string" ? err.detail : "Invalid input";
      }
    });

    // ---------- Add asset ----------
    document.getElementById("add-btn").addEventListener("click", () => {
     document.getElementById("add-btn").addEventListener("click", () => {
  document.getElementById("add-error").textContent = "";
  document.getElementById("add-dialog").showModal();
});
      document.getElementById("add-error").textContent = "";
      document.getElementById("add-dialog").showModal();
    });

    document.getElementById("a-cancel").addEventListener("click", () => {
      document.getElementById("add-dialog").close();
    });

    document.getElementById("a-save").addEventListener("click", async () => {
      const val = id => document.getElementById(id).value.trim() || null;
      const body = {
        ItemType: val("a-type"),
        Brand: val("a-brand"),
        Model: val("a-model"),
        SerialNo: val("a-serial"),
        Memory: val("a-memory"),
        Storage: val("a-storage"),
        Processor: val("a-processor"),
        Condition: document.getElementById("a-condition").value
      };
      const errorBox = document.getElementById("add-error");

      if (!body.ItemType || !body.SerialNo) {
        errorBox.textContent = "Item type and serial number are required";
        return;
      }

      const res = await fetch(API + "/assets", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body)
      });
      if (res.ok) {
        location.reload();
      } else {
        const err = await res.json();
        errorBox.textContent = typeof err.detail === "string" ? err.detail : "Invalid input";
      }
    });

    // ---------- Edit asset ----------
    let editAssetId = null;
    let editOriginalCondition = null;

    function openEdit(asset) {
      editAssetId = asset.AssetID;
      editOriginalCondition = asset.Condition;
      document.getElementById("edit-asset").textContent =
        asset.ItemType + " - " + asset.SerialNo + " (" + asset.Status + ")";
      document.getElementById("e-condition").value = asset.Condition;
      document.getElementById("e-status").value = "";
      document.getElementById("edit-error").textContent = "";
      document.getElementById("edit-dialog").showModal();
    }

    document.getElementById("e-cancel").addEventListener("click", () => {
      document.getElementById("edit-dialog").close();
    });

    document.getElementById("e-save").addEventListener("click", async () => {
      const errorBox = document.getElementById("edit-error");
      const body = {};
      const condition = document.getElementById("e-condition").value;
      const status = document.getElementById("e-status").value;

      if (condition !== editOriginalCondition) body.Condition = condition;
      if (status) body.Status = status;

      if (Object.keys(body).length === 0) {
        errorBox.textContent = "Nothing to change";
        return;
      }
      if (body.Status === "Retired" &&
          !confirm("Retiring is permanent and the asset can no longer be edited or transferred. Continue?")) {
        return;
      }

      const res = await fetch(API + "/assets/" + editAssetId, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body)
      });
      if (res.ok) {
        location.reload();
      } else {
        const err = await res.json();
        errorBox.textContent = typeof err.detail === "string" ? err.detail : "Invalid input";
      }
    });

    // ---------- Transfer history ----------
    async function openHistory(asset) {
      document.getElementById("history-asset").textContent =
        asset.ItemType + " - " + asset.SerialNo;
      const body = document.getElementById("history-body");
      body.innerHTML = "<tr><td colspan='5'>Loading...</td></tr>";
      document.getElementById("history-dialog").showModal();

      const res = await fetch(API + "/transfers?asset_id=" + asset.AssetID);
      const rows = await res.json();
      body.innerHTML = "";

      if (rows.length === 0) {
        body.innerHTML = "<tr><td colspan='5'>No transfers recorded</td></tr>";
        return;
      }
      rows.forEach(t => {
        const tr = document.createElement("tr");
        const cells = [
          t.TransferDate,
          t.FromName || "IT Stock",
          t.ToName || "IT Stock",
          t.HandledByName,
          t.Notes || ""
        ];
        cells.forEach(text => {
          const td = document.createElement("td");
          td.textContent = text;
          tr.appendChild(td);
        });
        body.appendChild(tr);
      });
    }

    document.getElementById("h-close").addEventListener("click", () => {
      document.getElementById("history-dialog").close();
    });

    // ---------- Export CSV ----------
    document.getElementById("export-btn").addEventListener("click", () => {
      const safe = v => {
        let s = String(v ?? "");
        if (/^[=+\-@\t\r]/.test(s)) s = "'" + s;
        return '"' + s.replace(/"/g, '""') + '"';
      };
      const header = columns.map(([, title]) => safe(title)).join(",");
      const lines = currentFiltered.map(a => columns.map(([key]) => safe(a[key])).join(","));
      const csv = "\uFEFF" + [header, ...lines].join("\r\n");

      const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = "it-assets-" + new Date().toISOString().slice(0, 10) + ".csv";
      link.click();
      URL.revokeObjectURL(url);
    });
  </script>
</body>
</html>
